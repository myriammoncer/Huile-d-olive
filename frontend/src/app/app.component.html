
@if (showLoader() && !isAdmin()) {
  <div class="app-loader" aria-hidden="true">
    <div class="app-loader__mark">
          <img class="app-transition__logo" src="assets/images/logo-wordmark.svg" alt="" />

      <span class="app-loader__word"></span>
      <span class="app-loader__bar"></span>
    </div>
  </div>
}



@if (!isAdmin()) {
  <app-navbar />
}

<main class="app-main" [@routeFade]="currentUrl()">
  <router-outlet />
</main>

@if (!isAdmin()) {
  <app-footer />
}
