<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="login__brand">
      <img class="login__logo" src="assets/images/logo-wordmark.svg" alt="Village 1800" />
      <span class="login__sub">Espace administration</span>
    </div>

    <div class="login__field">
      <label for="l-email">E-mail</label>
      <input id="l-email" type="email" formControlName="email" autocomplete="username" />
    </div>

    <div class="login__field">
      <label for="l-pass">Mot de passe</label>
      <input id="l-pass" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    @if (error()) {
      <p class="login__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="login__btn" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</div>
